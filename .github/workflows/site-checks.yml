name: Site checks

on:
  pull_request:
    branches: [main, gh_pages]
  push:
    branches: [main, gh_pages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    name: Navigation links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check navigation and site assets
        run: python3 -m unittest discover -s tests -v
